- type: trait
  id: VulpkaninFull
  name: trait-vulpkanin-full-name
  description: trait-vulpkanin-full-desc
  category: Species
  conditions:
  - !type:IsSpeciesCondition
    species: Anthropomorph
  effects:
  - !type:AddCompsEffect
    removeExisting: true
    components:
    - type: Vocal
      sounds:
        Male: MaleVulpkanin
        Female: FemaleVulpkanin
        Unsexed: MaleVulpkanin
    - type: Speech
      speechVerb: Vulpkanin
      allowedEmotes: [ 'Bark', 'Snarl', 'Whine', 'Howl', 'Growl' ]
      speechSounds: Vulpkanin
    - type: LanguageKnowledge
      speaks:
      - TauCetiBasic
      - Canilunzt
      understands:
      - TauCetiBasic
      - Canilunzt
    - type: LanguageSpeaker
      currentLanguage: TauCetiBasic
    - type: Temperature
      specificHeat: 44
    - type: TemperatureDamage
      heatDamageThreshold: 320
      coldDamageThreshold: 230
      coldDamage:
        types:
          Cold: 0.05
      heatDamage:
        types:
          Heat: 2.5
    - type: TemperatureProtection
      heatingCoefficient: 1.2
      coolingCoefficient: 0.3
    - type: JumpAbility
      action: ActionVulpkaninGravityJump
      canCollide: true
      jumpDistance: 3
      jumpSound:
        path: /Audio/Weapons/punchmiss.ogg
        params:
          pitch: 1.33
          volume: -5
          variation: 0.05
    - type: MessyDrinker
      spillChance: 0.33