- type: entity
  id: ELGyroscopeMachineCircuitboard
  parent: BaseMachineCircuitboard
  name: advanced gyroscope
  components:
  - type: Sprite
    state: supply
  - type: MachineBoard
    prototype: ELGyroscope
    requirements:
      Manipulator: 4
      Capacitor: 2
    stackRequirements:
      Glass: 4

- type: entity
  id: ELGyroscope
  parent: Gyroscope
  name: advanced gyroscope
  description: Increases the potential angular rotation of the shuttle.
  components:
  - type: Thruster
    thrusterType: Angular
    requireSpace: false
    baseThrust: 2500
    thrust: 2500
    thrustPerPartLevel: [2500, 3125, 3750, 4375, 4600]
  - type: ApcPowerReceiver
    powerLoad: 3000
  - type: Sprite
    sprite: _Erida/Structures/Shuttles/gyroscope.rsi
    snapCardinals: true
    layers:
    - state: base
      map: ["enum.ThrusterVisualLayers.Base"]
    - state: thrust
      map: ["enum.ThrusterVisualLayers.ThrustOn"]
      shader: unshaded
      visible: false
    - state: thrust_burn
      map: [ "enum.ThrusterVisualLayers.Thrusting" ]
      visible: false
    - state: thrust_burn_unshaded
      map: ["enum.ThrusterVisualLayers.ThrustingUnshaded"]
      shader: unshaded
      visible: false
  - type: Machine
    board: ELGyroscopeMachineCircuitboard

