# Loadout cases

## Base
- type: entity
  parent: BaseItem
  id: Box_dzeta
  name: кейс неопределённости
  description: Прочный военный кейс для оружия.
  components:
  - type: Item
    size: Large
  - type: Sprite
    sprite: _Erida/Objects/Сase_of_uncertainty/Rhbzz/leader.rsi
    state: icon
  - type: ThiefUndeterminedBackpack
    maxSelectedSets: 1
    possibleSets:
    - undbox_dzeta1
    - undbox_dzeta2
    - undbox_dzeta3
  - type: ActivatableUI
    key: enum.ThiefBackpackUIKey.Key
  - type: UserInterface
    interfaces:
      enum.ThiefBackpackUIKey.Key:
        type: ThiefBackpackBoundUserInterface

