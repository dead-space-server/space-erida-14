# Loadout cases

## Base
- type: entity
  parent: BaseItem
  id: Box_Red
  name: кейс неопределённости
  description: Прочный военный кейс для оружия.
  components:
  - type: Item
    size: Large
  - type: Sprite
    sprite: _Erida/Objects/Сase_of_uncertainty/Red/box.rsi
    state: icon
  - type: ThiefUndeterminedBackpack
    maxSelectedSets: 1
    possibleSets:
    - undbox_Red1
    - undbox_Red2
    - undbox_Red3
    - undbox_Red4
  - type: ActivatableUI
    key: enum.ThiefBackpackUIKey.Key
  - type: UserInterface
    interfaces:
      enum.ThiefBackpackUIKey.Key:
        type: ThiefBackpackBoundUserInterface

