# Loadout cases

## Base
- type: entity
  parent: BaseItem
  id: Box_gamma
  name: кейс неопределённости
  description: Прочный военный кейс для оружия.
  components:
  - type: Item
    size: Large
  - type: Sprite
    sprite: _Erida/Objects/Сase_of_uncertainty/Gamma/box.rsi
    state: icon
  - type: ThiefUndeterminedBackpack
    maxSelectedSets: 1
    possibleSets:
    - undbox_gamma1
    - undbox_gamma2
    - undbox_gamma3
    - undbox_gamma4
  - type: ActivatableUI
    key: enum.ThiefBackpackUIKey.Key
  - type: UserInterface
    interfaces:
      enum.ThiefBackpackUIKey.Key:
        type: ThiefBackpackBoundUserInterface

