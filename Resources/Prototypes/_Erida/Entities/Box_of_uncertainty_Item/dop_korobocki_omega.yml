# Loadout cases

## Base
- type: entity
  parent: BaseItem
  id: Box_omega_sup
  name: коробка неопределённости
  description: Прочный военная коробка для медекомтов.
  components:
  - type: Item
    size: Large
  - type: Sprite
    sprite: _Erida/Objects/Сase_of_uncertainty/Rhbzz/secondary.rsi
    state: icon
  - type: ThiefUndeterminedBackpack
    maxSelectedSets: 2
    possibleSets:
    - undbox_omega1sup
    - undbox_omega2sup
    - undbox_omega3sup
    - undbox_omega4sup
  - type: ActivatableUI
    key: enum.ThiefBackpackUIKey.Key
  - type: UserInterface
    interfaces:
      enum.ThiefBackpackUIKey.Key:
        type: ThiefBackpackBoundUserInterface

