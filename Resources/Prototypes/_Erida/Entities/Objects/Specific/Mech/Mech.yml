- type: entity
  id: MechPatriot
  parent: BaseMech
  name: EXO-45 Экзокостюм "Патриот"
  description: Тяжелобронированный экзокостюм, оснащенный ракетницей и пулеметом Гатлинга.
  components:
  - type: Sprite
    drawdepth: Mobs
    noRot: true
    sprite: _Erida/Objects/Weapons/Guns/Mech/Patriot.rsi
    layers:
      - map: [ "enum.MechVisualLayers.Base" ]
        state: Patriot
  - type: FootstepModifier
    footstepSoundCollection:
      path: /Audio/Mecha/sound_mecha_powerloader_step.ogg
  - type: Mech
    baseState: Patriot
    brokenState: Patriot-broken
    mechToPilotDamageMultiplier: 0
    maxIntegrity: 600
    pilotWhitelist:
      components:
        - HumanoidProfile
    airtight: true
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 3
  - type: Damageable
    damageModifierSet: HeavyArmor