- type: entity
  name: Лечащая пушка
  parent: [BaseWeaponBattery]
  id: HealingGun
  components:
  - type: Sprite
    sprite: _Erida/Objects/Weapons/Guns/Battery/healing_gun.rsi
    layers:
    - state: icon
  - type: Item
    size: Huge
    shape:
    - 0,0,10,10
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: false
  - type: Clothing
    sprite: _Erida/Objects/Weapons/Guns/Battery/healing_gun.rsi
    quickEquip: false
    slots:
    - suitStorage
  - type: Wieldable
  - type: Gun
    fireRate: 0.5
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/taser2.ogg
  - type: ProjectileBatteryAmmoProvider
    proto: HealingBruteBolt
    fireCost: 150
  - type: BatteryWeaponFireModes
    fireModes:
    - proto: HealingBruteBolt
      fireCost: 150
    - proto: HealingBurnBolt
      fireCost: 150
    - proto: HealingToxinBolt
      fireCost: 100
  - type: Battery
    maxCharge: 1500
    startingCharge: 1500