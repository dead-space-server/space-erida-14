- type: reagent
  id: VitriumFroth
  name: reagent-name-vitrium-froth
  group: Medicine
  desc: reagent-desc-vitrium-froth
  physicalDesc: reagent-physical-desc-exotic-smelling
  flavor: sweet
  color: "#d3a308"
  metabolisms:
    Bloodstream:
      effects:
      - !type:HealthChange
        damage:
          groups:
            Brute: -2
          types:
            Heat: -1
            Shock: -1
            Cold: -1

- type: reagent
  id: SerakaExtract
  name: reagent-name-seraka-extract
  group: Medicine
  desc: reagent-desc-seraka-extract
  physicalDesc: reagent-physical-desc-sticky
  flavor: metallic
  color: "#00767c"
  metabolisms:
    Bloodstream:
      effects:
      - !type:HealthChange
        damage:
          types:
            Bloodloss: -1
      - !type:ModifyBloodLevel
        amount: 1
      - !type:HealthChange # Overdose can cause blood to clot in the veins
        conditions:
        - !type:ReagentCondition
          reagent: SerakaExtract
          min: 8
        damage:
          groups:
            Airloss: 7

- type: reagent
  id: TranexamicAcidPlus
  name: reagent-name-tranexamic-acid
  group: Medicine
  desc: reagent-desc-tranexamic-acid
  physicalDesc: reagent-physical-desc-viscous
  flavor: medicine
  color: "#ba7d7d"
  metabolisms:
    Medicine:
      effects:
      - !type:ModifyBleed
        amount: -1.5
      - !type:HealthChange
        conditions:
        - !type:MobStateCondition
          mobstate: Critical
        - !type:ReagentCondition
          reagent: TranexamicAcidPlus
          min: 20
        damage:
          groups:
            Brute: -5
            Burn: -5
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: TranexamicAcidPlus
          min: 20
        damage:
          types:
            Asphyxiation: -3
            Poison: -0.5
            Bloodloss: -2
            Radiation: -1
          groups:
            Brute: -0.3
            Burn: -0.3
      - !type:GenericStatusEffect
        key: Stun
        time: 0.75
        type: Remove
      - !type:GenericStatusEffect
        key: KnockedDown
        time: 0.75
        type: Remove
