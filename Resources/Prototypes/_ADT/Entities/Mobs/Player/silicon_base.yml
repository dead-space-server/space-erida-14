- type: entity
  save: false
  abstract: true
  id: ADTPlayerSiliconBase
  components:
    - type: Reactive
      groups:
        Acidic: [Touch]
    - type: Input
      context: "human"
    - type: InputMover
    - type: ZombieImmune
    - type: IgnoreHealOnBuckle
    - type: IgnoreCryopods
    - type: DamagedSiliconAccent
    - type: MobMover
    - type: DamageOnHighSpeedImpact
      damage:
        types:
          Blunt: 5
      soundHit:
        path: /Audio/Effects/hit_kick.ogg
    - type: Clickable
    - type: Damageable
    - type: Injurable
      damageContainer: Inorganic
    - type: InteractionOutline
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeCircle
            radius: 0.35
          density: 185
          mask:
            - MobMask
          layer:
            - MobLayer
    - type: FloorOcclusion
    - type: MovementSpeedModifier
      baseWalkSpeed: 3
      baseSprintSpeed: 4
    - type: Sprite
      sprite: _ADT/Mobs/Species/IPC/parts.rsi
      state: full
      noRot: true
      drawdepth: Mobs
    - type: Physics
      bodyType: KinematicController
    - type: Body
    - type: DoAfter
    - type: Examiner
    - type: StandingState
    - type: Alerts
    - type: EyeProtection
      protectionTime: 12
    - type: Silicon
      entityType: enum.SiliconType.Player
      batteryPowered: false
      chargeThresholdMid: 0.60
      chargeThresholdLow: 0.30
      chargeThresholdCritical: 0
      speedModifierThresholds:
        4: 1
        3: 1
        2: 0.80
        1: 0.45
        0: 0.00
    - type: RadiationReceiver
    - type: AtmosExposed
    - type: Temperature
      currentTemperature: 400
      specificHeat: 24
      atmosTemperatureTransferEfficiency: 0.05
    - type: TemperatureDamage
      heatDamageThreshold: 700
      coldDamageThreshold: 0
      coldDamage:
        types:
          Cold: 0.1
      heatDamage:
        types:
          Heat: 0.25
    - type: ThermalRegulator
      metabolismHeat: 600
      radiatedHeat: 350
      implicitHeatRegulation: 350
      sweatHeatRegulation: 0
      shiveringHeatRegulation: 1200
      normalBodyTemperature: 400
      thermalRegulationTemperatureThreshold: 125
    - type: ComplexInteraction
    - type: MobCollision
    - type: GravityAffected

- type: entity
  parent: ADTPlayerSiliconBase
  id: PlayerSiliconHumanoidBase
  abstract: true
  components:
    - type: Crawler
    - type: StatusIcon
    - type: SSDIndicator
    - type: MobState
      allowedStates:
        - Alive
        - Dead
    - type: MobThresholds
      thresholds:
        0: Alive
        165: Dead
    - type: Damageable
    - type: Injurable
      damageContainer: Silicon
    - type: Stamina
      baseCritThreshold: 200
    - type: Destructible
      thresholds:
        - trigger: !type:DamageTrigger
            damage: 300
          behaviors:
            - !type:GibBehavior {}
    - type: Icon
      sprite: _ADT/Mobs/Species/IPC/parts.rsi
      state: full
    - type: MindContainer
    - type: Sprite
      noRot: true
      drawdepth: Mobs
      layers:
        - map: ["enum.HumanoidVisualLayers.Chest"]
        - map: ["enum.HumanoidVisualLayers.Head"]
        - map: ["enum.HumanoidVisualLayers.Snout"]
        - map: ["enum.HumanoidVisualLayers.Eyes"]
        - map: ["enum.HumanoidVisualLayers.RArm"]
        - map: ["enum.HumanoidVisualLayers.LArm"]
        - map: ["enum.HumanoidVisualLayers.RLeg"]
        - map: ["enum.HumanoidVisualLayers.LLeg"]
        - shader: StencilClear
          sprite: Mobs/Species/Human/parts.rsi
          state: l_leg
        - shader: StencilMask
          map: ["enum.HumanoidVisualLayers.StencilMask"]
          sprite: Mobs/Customization/masking_helpers.rsi
          state: female_full
          visible: false
        - map: ["enum.HumanoidVisualLayers.LFoot"]
        - map: ["enum.HumanoidVisualLayers.RFoot"]
        - map: ["socks"]
        - map: ["underwearb"]
        - map: ["underweart"]
        - map: ["jumpsuit"]
        - map: ["enum.HumanoidVisualLayers.LHand"]
        - map: ["enum.HumanoidVisualLayers.RHand"]
        - map: ["enum.HumanoidVisualLayers.Handcuffs"]
          color: "#ffffff"
          sprite: Objects/Misc/handcuffs.rsi
          state: body-overlay-2
          visible: false
        - map: ["id"]
        - map: ["gloves"]
        - map: ["shoes"]
        - map: ["ears"]
        - map: ["outerClothing"]
        - map: ["eyes"]
        - map: ["belt"]
        - map: ["neck"]
        - map: ["back"]
        - map: ["enum.HumanoidVisualLayers.FacialHair"]
        - map: ["enum.HumanoidVisualLayers.Hair"]
        - map: ["enum.HumanoidVisualLayers.HeadSide"]
        - map: ["enum.HumanoidVisualLayers.HeadTop"]
        - map: ["mask"]
        - map: ["head"]
        - map: ["pocket1"]
        - map: ["pocket2"]
        - map: ["enum.HumanoidVisualLayers.Tail"]
        - map: ["clownedon"]
          sprite: "Effects/creampie.rsi"
          state: "creampie_human"
          visible: false
    - type: Repairable
      fuelCost: 3
      selfRepairPenalty: 2
      doAfterDelay: 2
      damage:
        types:
          Blunt: -10
          Slash: -10
          Piercing: -10
    - type: Bloodstream
      damageBleedModifiers: BloodlossHuman
      bleedReductionAmount: 0
      bloodReferenceSolution:
        reagents: []
      bleedPuddleThreshold: 3
      bloodRefreshAmount: 0
      bloodlossThreshold: 0
      maxBleedAmount: 0
      bloodlossDamage:
        types:
          Heat: 1.5
      bloodlossHealDamage:
        types:
          Heat: 0
    - type: Flammable
      fireSpread: true
      canResistFire: true
      damage:
        types:
          Heat: 0.75
    - type: Temperature
      currentTemperature: 280
      specificHeat: 50
      atmosTemperatureTransferEfficiency: 0.4
    - type: TemperatureDamage
      heatDamageThreshold: 320
      coldDamageThreshold: 255
      coldDamage:
        types:
          Cold: 0.1
      heatDamage:
        types:
          Heat: 0.15
    - type: ThermalRegulator
      metabolismHeat: 1000
      radiatedHeat: 800
      implicitHeatRegulation: 600
      sweatHeatRegulation: 0
      shiveringHeatRegulation: 12000
      normalBodyTemperature: 280
      thermalRegulationTemperatureThreshold: 32
    - type: Polymorphable
    - type: Identity
    - type: MovedByPressure
    - type: DamageOnHighSpeedImpact
      damage:
        types:
          Blunt: 5
      soundHit:
        path: /Audio/Effects/metal_break1.ogg
    - type: LagCompensation
    - type: RangedDamageSound
      soundGroups:
        Brute:
          collection: MetalBulletImpact
      soundTypes:
        Heat:
          collection: MetalLaserImpact
    - type: Tag
      tags:
        - CanPilot
        - FootstepSound
        - DoorBumpOpener
    - type: Hands
    - type: Inventory
      templateId: human
    - type: InventorySlots
    - type: Appearance
    - type: RotationVisuals
    - type: FloatingVisuals
    - type: FireVisuals
      sprite: Mobs/Effects/onfire.rsi
      normalState: Generic_mob_burning
      alternateState: Standing
      fireStackAlternateState: 3
    - type: CombatMode
      canDisarm: true
    - type: Climbing
    - type: Cuffable
    - type: AnimationPlayer
    - type: Buckle
    - type: CreamPied
      sprite:
        sprite: Effects/creampie.rsi
        state: creampie_human
    - type: Stripping
    - type: Strippable
    - type: UserInterface
      interfaces:
        enum.VoiceMaskUIKey.Key:
          type: VoiceMaskBoundUserInterface
        enum.HumanoidMarkingModifierKey.Key:
          type: HumanoidMarkingModifierBoundUserInterface
        enum.StrippingUiKey.Key:
          type: StrippableBoundUserInterface
        enum.StoreUiKey.Key:
          type: StoreBoundUserInterface
    - type: Emoting
    - type: Grammar
      attributes:
        proper: true
    - type: StandingState
    - type: CanEscapeInventory
    - type: HumanoidProfile
    - type: Body
    - type: Ensnareable
      sprite: Objects/Misc/ensnare.rsi
    - type: Speech
      speechSounds: Pai
    - type: Vocal
      sounds:
        Male: MaleHuman
        Female: FemaleHuman
        Unsexed: MaleHuman
    - type: MeleeWeapon
      hidden: true
      soundHit:
        collection: Punch
      angle: 30
      animation: WeaponArcFist
      attackRate: 1
      damage:
        types:
          Blunt: 6
    - type: MobPrice
      price: 1500
      deathPenalty: 0.01
    - type: Pullable
    - type: Puller
    - type: Grabbable
    - type: Reactive
      groups:
        Flammable: [Touch]
        Extinguish: [Touch]
        Acidic: [Touch, Ingestion]
      reactions:
        - reagents: [Water, SpaceCleaner]
          methods: [Touch]
          effects:
            - !type:WashCreamPie
    - type: BodyEmotes
      soundsId: GeneralBodyEmotes
    - type: DamageVisuals
      thresholds: [20, 50, 100]
      targetLayers:
        - "enum.HumanoidVisualLayers.Chest"
        - "enum.HumanoidVisualLayers.Head"
        - "enum.HumanoidVisualLayers.LArm"
        - "enum.HumanoidVisualLayers.LLeg"
        - "enum.HumanoidVisualLayers.RArm"
        - "enum.HumanoidVisualLayers.RLeg"
      damageOverlayGroups:
        Brute:
          sprite: Mobs/Effects/brute_damage.rsi
          color: "#1a1a1a"
        Burn:
          sprite: Mobs/Effects/burn_damage.rsi
    - type: IdExaminable
    - type: HealthExaminable
      examinableTypes:
        - Blunt
        - Slash
        - Piercing
        - Heat
        - Shock
    - type: StatusEffects
      allowed:
        - Stun
        - KnockedDown
        - SlowedDown
        - Stutter
        - Weakness
        - SeeingRainbows
        - Electrocution
        - SlurredSpeech
        - Muted
        - Pacified
        - SeeingStatic
    - type: Blindable
