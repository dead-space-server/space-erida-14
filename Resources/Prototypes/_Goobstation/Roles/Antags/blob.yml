- type: antag
  id: Blob
  name: roles-antag-blob-name
  antagonist: true
  setPreference: true
  objective: roles-antag-blob-objective
  guides: [ Blob ]
  requirements:
  - !type:OverallPlaytimeRequirement
    time: 18000 # 5h # Goobstation-RoleTime

- type: antagSpecifier
  parent: RestrictedAntag
  id: Blob
  prefRoles: [ Blob ]
  allowNonHumans: true
  jobBlacklist:
  - Chaplain
  briefing:
    text: blob-carrier-role-greeting
    color: Plum
    sound: "/Audio/Announcements/bloblarm.ogg"
  components:
  - type: BlobCarrier
  mindRoles:
  - MindRoleBlob
