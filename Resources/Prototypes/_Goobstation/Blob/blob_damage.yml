# Erida edit: Goob blob prototypes reference these sets but the source
# snapshot does not define them in the imported Blob closure.

- type: damageContainer
  id: Blob
  supportedGroups:
  - Brute
  - Burn
  supportedTypes:
  - Heat
  - Shock
  - Structural

- type: damageModifierSet
