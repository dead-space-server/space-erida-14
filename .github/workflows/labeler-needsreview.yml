name: "Labels: Needs Review"

on:
  check_suite:
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: read

jobs:
  needs_review:
    if: >
      github.repository == 'dead-space-server/space-erida-14' &&
      github.event.check_suite.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR and verify all checks passed
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const suite = context.payload.check_suite;

            if (!suite.pull_requests || suite.pull_requests.length === 0) {
              core.info('No PR associated with this check_suite, skipping.');
              core.setOutput('proceed', 'false');
              return;
            }

            const { data: checksData } = await github.rest.checks.listForSuite({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_suite_id: suite.id,
              per_page: 100
            });

            const allPassed = checksData.check_runs.every(
              (run) => run.status === 'completed' && run.conclusion === 'success'
            );

            if (!allPassed) {
              core.info('Not all check runs succeeded, skipping.');
              core.setOutput('proceed', 'false');
              return;
            }

            const shortPr = suite.pull_requests[0];
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: shortPr.number
            });

            if (pr.draft) {
              core.info('PR is draft, skipping.');
              core.setOutput('proceed', 'false');
              return;
            }

            if (pr.user.login === 'Erida-change-bot') {
              core.info('PR authored by bot, skipping.');
              core.setOutput('proceed', 'false');
              return;
            }

            if (pr.state !== 'open') {
              core.info('PR is not open, skipping.');
              core.setOutput('proceed', 'false');
              return;
            }

            core.setOutput('proceed', 'true');
            core.setOutput('number', pr.number);

      - name: Mark PR as needing review
        if: steps.pr.outputs.proceed == 'true'
        uses: step-security/action-add-labels@v1.1.1
        with:
          number: ${{ steps.pr.outputs.number }}
          labels: "S: Needs Review"

      - name: Remove stale review state labels
        if: steps.pr.outputs.proceed == 'true'
        uses: step-security/action-remove-labels@v1.3.1
        with:
          number: ${{ steps.pr.outputs.number }}
          labels: |
            S: Awaiting Changes
            S: Approved
