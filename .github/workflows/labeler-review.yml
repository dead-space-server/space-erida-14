name: "Labels: Approved"

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  approved_review:
    # Change the repository name after you've made sure the team name is correct for your fork!
    if: ${{ (github.repository == 'dead-space-server/space-erida-14') && (github.event.review.state == 'approved') }}
    runs-on: ubuntu-latest
    steps:
    - name: Record approved review
      # Erida edit: fork PR review events have a read-only token; a workflow_run follow-up applies the label.
      run: |
        echo "Approved review for PR #${{ github.event.pull_request.number }}"
        echo "Reviewed commit: ${{ github.event.review.commit_id }}"
