name: License Metadata Check

on:
  pull_request_target:
    types: [ opened, reopened, synchronize, ready_for_review ]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  license_headers:
    name: License Metadata Check
    if: github.actor != 'Erida-change-bot' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout license checker
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: checker
          persist-credentials: false

      - name: Checkout pull request
        uses: actions/checkout@v7.0.0
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          path: pull-request
          fetch-depth: 0
          persist-credentials: false

      - name: Check new file license headers
        id: license-check
        continue-on-error: true
        working-directory: pull-request
        run: >
          python3 ../checker/Tools/Erida/check_license_headers.py
          --repo .
          --base-ref "${{ github.event.pull_request.base.sha }}"
          --head-ref HEAD
          --format github
          --comment-path ../license-metadata-comment.md

      - name: Create or update license metadata error comment
        if: steps.license-check.outcome == 'failure'
        uses: marocchino/sticky-pull-request-comment@v3.0.4
        with:
          header: erida-license-metadata-check
          path: license-metadata-comment.md

      - name: Delete license metadata error comment after passing check
        if: steps.license-check.outcome == 'success'
        uses: marocchino/sticky-pull-request-comment@v3.0.4
        with:
          header: erida-license-metadata-check
          delete: true

      - name: Fail on license metadata errors
        if: steps.license-check.outcome == 'failure'
        run: exit 1
